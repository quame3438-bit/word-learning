<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>背单词</title>
<style>
  :root{
    --gap:12px;
    --radius:16px;
    --border:#d9d9df;
    --bg:#f6f7f9;
    --card:#fff;
    --text:#17181c;
    --muted:#777b85;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .app{max-width:900px;margin:0 auto;padding:18px 14px 32px}
  h1{font-size:24px;margin:0 0 14px;text-align:center}
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  button,.file-label{
    border:1px solid var(--border);background:#fff;border-radius:12px;
    padding:10px 14px;font-size:16px;cursor:pointer;
  }
  input[type=file]{display:none}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 14px}
  .status{font-size:14px;text-align:center;margin:8px 0 14px;color:var(--muted)}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);
  }
  .pair{
    display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);
  }
  .side{
    min-height:150px;border:1px solid var(--border);border-radius:14px;
    padding:14px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:28px;font-weight:650;line-height:1.35;
    background:#fff;word-break:break-word;
  }
  .side.hidden-text{
    color:transparent;
    text-shadow:none;
    user-select:none;
  }
  .controls{
    display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:10px;
  }
  .controls button{width:100%}
  .pronounce{
    margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;text-align:center;
  }
  .english{font-size:24px;font-weight:700;margin-bottom:6px}
  .ipa{font-size:18px;color:var(--muted);min-height:26px}
  .speak{
    margin-top:10px;font-size:17px;padding:10px 18px;
  }
  .nav{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    gap:10px;margin-top:16px;
  }
  .counter{text-align:center;color:var(--muted);min-width:90px}
  .raw{
    margin-top:16px;
  }
  textarea{
    width:100%;min-height:150px;border:1px solid var(--border);border-radius:12px;
    padding:12px;font-size:15px;resize:vertical;background:#fff;
  }
  .raw-actions{display:flex;gap:10px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap}

  .folder-panel{
    margin:0 0 14px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;
  }
  .folder-title{font-weight:700;margin-bottom:10px}
  .folder-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .folder-row select{
    flex:1;min-width:180px;border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;font-size:15px;background:#fff;
  }
  .folder-meta{font-size:13px;color:var(--muted);margin-top:8px}

  .cloud{
    margin-top:16px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;
  }
  .cloud-title{font-weight:700;margin-bottom:10px}
  .cloud-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .cloud input{
    flex:1;min-width:210px;border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;font-size:15px;
  }
  .cloud-note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
  @media(max-width:560px){
    .app{padding:12px 10px 24px}
    h1{font-size:22px}
    .side{font-size:23px;min-height:135px}
    .english{font-size:21px}
  }
</style>

<script>
const STORAGE_KEY = "word_learning_v2_state";
const TTS_PASSWORD_KEY = "word_learning_tts_password";
const VOICE_SOURCE_KEY = "word_learning_voice_source";
const SUPABASE_URL = "https://braarnzywbodyfdclodc.supabase.co";
const SUPABASE_KEY = "sb_publishable_JecnrG-198PERwUD5lFhaQ_wc0vV4Lj";
const TTS_URL = "https://braarnzywbodyfdclodc.supabase.co/functions/v1/tts";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const state = {
  items: [],
  index: 0,
  leftHidden: false,
  rightHidden: false,
  swap: false,
  folders: [],
  activeFolderId: ""
};

function nowText(){
  try{
    return new Date().toLocaleString("zh-CN",{hour12:false});
  }catch(e){ return new Date().toISOString(); }
}
function makeFolder(name="学习记录"){
  return {
    id:"f_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    name,
    items:[],
    index:0,
    leftHidden:false,
    rightHidden:false,
    swap:false,
    raw:"",
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
}
function ensureFolders(){
  if(!Array.isArray(state.folders) || !state.folders.length){
    const f=makeFolder("默认学习");
    state.folders=[f];
    state.activeFolderId=f.id;
  }
  if(!state.activeFolderId || !state.folders.some(f=>f.id===state.activeFolderId)){
    state.activeFolderId=state.folders[0].id;
  }
}
function currentFolder(){
  ensureFolders();
  return state.folders.find(f=>f.id===state.activeFolderId) || state.folders[0];
}
function captureCurrentToFolder(){
  const f=currentFolder();
  f.items=Array.isArray(state.items)?state.items:[];
  f.index=state.index||0;
  f.leftHidden=!!state.leftHidden;
  f.rightHidden=!!state.rightHidden;
  f.swap=!!state.swap;
  f.raw=document.getElementById("pasteArea")?.value || "";
  f.updatedAt=new Date().toISOString();
}
function loadFolderToCurrent(folder){
  if(!folder) return;
  state.items=Array.isArray(folder.items)?folder.items:[];
  state.index=Number.isFinite(folder.index)?folder.index:0;
  state.leftHidden=!!folder.leftHidden;
  state.rightHidden=!!folder.rightHidden;
  state.swap=!!folder.swap;
  if(document.getElementById("pasteArea")) $("pasteArea").value=folder.raw || "";
}
function renderFolders(){
  ensureFolders();
  const sel=$("folderSelect");
  if(!sel) return;
  sel.innerHTML="";
  state.folders.forEach(f=>{
    const o=document.createElement("option");
    o.value=f.id;
    o.textContent=f.name || "未命名";
    sel.appendChild(o);
  });
  sel.value=state.activeFolderId;
  const f=currentFolder();
  let updated="";
  try{ updated=new Date(f.updatedAt).toLocaleString("zh-CN",{hour12:false}); }catch(e){}
  $("folderMeta").textContent=`自动保存｜${f.items?.length || 0} 条｜上次学习：${updated || "—"}`;
}
function saveLocal(){
  try{
    captureCurrentToFolder();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      folders: state.folders,
      activeFolderId: state.activeFolderId,
      items: state.items,
      index: state.index,
      leftHidden: state.leftHidden,
      rightHidden: state.rightHidden,
      swap: state.swap,
      raw: document.getElementById("pasteArea")?.value || ""
    }));
  }catch(e){}
  renderFolders();
  if(!autoSyncBusy) scheduleCloudSync();
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(!d){
      ensureFolders();
      loadFolderToCurrent(currentFolder());
      return;
    }
    if(Array.isArray(d.folders) && d.folders.length){
      state.folders=d.folders;
      state.activeFolderId=d.activeFolderId || d.folders[0].id;
      ensureFolders();
      loadFolderToCurrent(currentFolder());
    }else{
      // Upgrade old single-record versions into one folder.
      const f=makeFolder("默认学习");
      f.items=Array.isArray(d.items)?d.items:[];
      f.index=Number.isFinite(d.index)?d.index:0;
      f.leftHidden=!!d.leftHidden;
      f.rightHidden=!!d.rightHidden;
      f.swap=!!d.swap;
      f.raw=typeof d.raw==="string"?d.raw:"";
      state.folders=[f];
      state.activeFolderId=f.id;
      loadFolderToCurrent(f);
    }
  }catch(e){
    ensureFolders();
    loadFolderToCurrent(currentFolder());
  }
}

const $ = id => document.getElementById(id);
const leftBox = $("leftBox");
const rightBox = $("rightBox");
const englishWord = $("englishWord");
const ipaEl = $("ipa");
const counter = $("counter");
const statusEl = $("status");

function hasLatin(s){
  return /[A-Za-z]/.test(s || "");
}
function hasCJK(s){
  return /[\u3400-\u9FFF]/.test(s || "");
}
function looksEnglish(s){
  if(!s) return false;
  const letters = (s.match(/[A-Za-z]/g)||[]).length;
  const cjk = (s.match(/[\u3400-\u9FFF]/g)||[]).length;
  return letters > 0 && letters >= cjk * 2;
}
function cleanLine(s){
  return s.replace(/^\s*\d+[\.\、\)]?\s*/, "").trim();
}
function parseText(text){
  const lines = text
    .replace(/\r/g,"")
    .split("\n")
    .map(cleanLine)
    .filter(Boolean);

  const items = [];
  let pending = null;

  for(let i=0;i<lines.length;i++){
    const line = lines[i];

    // Try common separators.
    let parts = null;
    const patterns = [
      /\s*\t+\s*/,
      /\s+[—–-]\s+/,
      /\s*[:：]\s*/
    ];
    for(const p of patterns){
      const m = line.split(p);
      if(m.length >= 2){
        parts = [m[0].trim(), m.slice(1).join(" ").trim()];
        break;
      }
    }

    if(parts && parts[0] && parts[1]){
      let a = parts[0], b = parts[1];
      if(looksEnglish(a) && !looksEnglish(b)){
        items.push({left:a,right:b,english:a});
      }else if(looksEnglish(b) && !looksEnglish(a)){
        items.push({left:a,right:b,english:b});
      }else{
        items.push({left:a,right:b,english: looksEnglish(a) ? a : (looksEnglish(b)?b:a)});
      }
      pending = null;
      continue;
    }

    // Pair consecutive lines by language.
    if(pending === null){
      pending = line;
    }else{
      const a = pending, b = line;
      const aEng = looksEnglish(a), bEng = looksEnglish(b);
      if(aEng !== bEng || hasCJK(a) !== hasCJK(b)){
        items.push({
          left:a,
          right:b,
          english:aEng ? a : (bEng ? b : (hasLatin(a)?a:b))
        });
        pending = null;
      }else{
        // Same-type lines: keep first as standalone and shift.
        items.push({left:a,right:"",english:aEng ? a : ""});
        pending = b;
      }
    }
  }
  if(pending !== null){
    items.push({left:pending,right:"",english:looksEnglish(pending)?pending:""});
  }

  return items.filter(x => x.left || x.right);
}

function ipaFor(text){
  if(!text) return "";
  const key = text.toLowerCase().trim();
  if(IPA[key]) return IPA[key];
  const words = key.match(/[a-z']+/g) || [];
  if(words.length && words.every(w => IPA[w])){
    return words.map(w => IPA[w].replace(/^\/|\/$/g,"")).join(" ") ? 
      "/" + words.map(w => IPA[w].replace(/^\/|\/$/g,"")).join(" ") + "/" : "";
  }
  return "";
}

function render(){
  if(!state.items.length){
    leftBox.textContent = "左侧";
    rightBox.textContent = "右侧";
    englishWord.textContent = "—";
    ipaEl.textContent = "音标将在可获取时显示";
    counter.textContent = "0 / 0";
    statusEl.textContent = "还没有导入内容";
    return;
  }
  state.index = Math.max(0, Math.min(state.index, state.items.length-1));
  const item = state.items[state.index];
  const left = state.swap ? item.right : item.left;
  const right = state.swap ? item.left : item.right;

  leftBox.textContent = left || " ";
  rightBox.textContent = right || " ";
  leftBox.classList.toggle("hidden-text", state.leftHidden);
  rightBox.classList.toggle("hidden-text", state.rightHidden);
  $("leftToggle").textContent = state.leftHidden ? "显示左侧" : "隐藏左侧";
  $("rightToggle").textContent = state.rightHidden ? "显示右侧" : "隐藏右侧";

  let eng = item.english || "";
  if(!eng){
    const cands = [item.left,item.right].filter(looksEnglish);
    eng = cands[0] || "";
  }
  englishWord.textContent = eng || "未识别英文";
  const ipa = ipaFor(eng);
  ipaEl.textContent = ipa || "未内置此词音标";
  counter.textContent = `${state.index+1} / ${state.items.length}`;
  statusEl.textContent = `已识别 ${state.items.length} 条`;
  saveLocal();
}

function loadText(text){
  const items = parseText(text);
  state.items = items;
  state.index = 0;
  state.leftHidden = false;
  state.rightHidden = false;
  $("leftToggle").textContent = "隐藏左侧";
  $("rightToggle").textContent = "隐藏右侧";
  render();
}


$("folderSelect").addEventListener("change", ()=>{
  captureCurrentToFolder();
  state.activeFolderId=$("folderSelect").value;
  loadFolderToCurrent(currentFolder());
  render();
  saveLocal();
});

$("newFolderBtn").addEventListener("click", ()=>{
  captureCurrentToFolder();
  const defaultName="学习记录 "+(state.folders.length+1);
  const name=(prompt("请输入文件夹名称",defaultName)||"").trim();
  if(!name) return;
  const f=makeFolder(name);
  state.folders.push(f);
  state.activeFolderId=f.id;
  loadFolderToCurrent(f);
  render();
  saveLocal();
});

$("renameFolderBtn").addEventListener("click", ()=>{
  const f=currentFolder();
  const name=(prompt("修改文件夹名称",f.name||"")||"").trim();
  if(!name) return;
  f.name=name;
  f.updatedAt=new Date().toISOString();
  saveLocal();
});

$("deleteFolderBtn").addEventListener("click", ()=>{
  ensureFolders();
  const f=currentFolder();
  if(state.folders.length===1){
    if(!confirm("这是最后一个文件夹。删除后会重新建立一个空白“默认学习”，确定删除吗？")) return;
    state.folders=[];
    state.activeFolderId="";
    ensureFolders();
  }else{
    if(!confirm(`确定删除“${f.name}”吗？其中的单词和学习位置也会删除。`)) return;
    state.folders=state.folders.filter(x=>x.id!==f.id);
    state.activeFolderId=state.folders[0].id;
  }
  loadFolderToCurrent(currentFolder());
  render();
  saveLocal();
});

$("fileInput").addEventListener("change", async e=>{
  const f = e.target.files[0];
  if(!f) return;
  const text = await f.text();
  $("pasteArea").value = text;
  loadText(text);
});

$("parseBtn").addEventListener("click", ()=>loadText($("pasteArea").value));

$("prevBtn").addEventListener("click", ()=>{
  if(!state.items.length) return;
  state.index = (state.index - 1 + state.items.length) % state.items.length;
  render();
});
$("nextBtn").addEventListener("click", ()=>{
  if(!state.items.length) return;
  state.index = (state.index + 1) % state.items.length;
  render();
});

$("leftToggle").addEventListener("click", ()=>{
  state.leftHidden = !state.leftHidden;
  $("leftToggle").textContent = state.leftHidden ? "显示左侧" : "隐藏左侧";
  render();
});
$("rightToggle").addEventListener("click", ()=>{
  state.rightHidden = !state.rightHidden;
  $("rightToggle").textContent = state.rightHidden ? "显示右侧" : "隐藏右侧";
  render();
});
$("swapBtn").addEventListener("click", ()=>{
  state.swap = !state.swap;
  render();
});
$("resetBtn").addEventListener("click", ()=>{
  state.items = []; state.index = 0; state.swap = false;
  $("pasteArea").value = "";
  render();
});
$("speakBtn").addEventListener("click", async ()=>{
  if(!state.items.length) return;
  const item = state.items[state.index];
  const eng = item.english || [item.left,item.right].find(looksEnglish) || "";
  if(!eng){
    $("ttsStatus").textContent = "当前内容没有识别到英文。";
    return;
  }

  const source = $("voiceSource")?.value || "google";

  if(source === "google"){
    $("ttsStatus").textContent = "当前：谷歌/系统英文发音";
    if(!("speechSynthesis" in window)){
      $("ttsStatus").textContent = "当前浏览器不支持系统语音。";
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(eng);
    u.lang = "en-US";
    u.rate = 0.9;
    const voices = speechSynthesis.getVoices();
    const googleVoice = voices.find(v => /Google.*English/i.test(v.name))
                     || voices.find(v => /Google/i.test(v.name) && /^en/i.test(v.lang))
                     || voices.find(v => /^en(-|_)/i.test(v.lang))
                     || voices.find(v => /^en/i.test(v.lang));
    if(googleVoice) u.voice = googleVoice;
    u.onerror = ()=>{ $("ttsStatus").textContent = "谷歌/系统发音失败，请切换腾讯云 AI。"; };
    speechSynthesis.speak(u);
    return;
  }

  const ttsPassword = localStorage.getItem(TTS_PASSWORD_KEY) || "";
  if(!ttsPassword){
    refreshTtsLoginUI();
    $("ttsStatus").textContent = "请先登录腾讯云发音。";
    return;
  }

  $("speakBtn").disabled = true;
  $("ttsStatus").textContent = "腾讯云 AI 正在生成…";

  try{
    const r = await fetch(TTS_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-transcribe-password":ttsPassword
      },
      body:JSON.stringify({
        text:eng,
        voiceType:502003,
        speed:-0.5,
        segmentRate:0
      })
    });

    if(!r.ok){
      let msg = "";
      try{
        const j = await r.json();
        msg = j.error || j.message || "";
      }catch(e){
        try{ msg = await r.text(); }catch(_){}
      }
      if(r.status === 401 || r.status === 403){
        localStorage.removeItem(TTS_PASSWORD_KEY);
        refreshTtsLoginUI();
      }
      throw new Error(msg || `HTTP ${r.status}`);
    }

    const blob = await r.blob();
    if(!blob.size) throw new Error("腾讯云返回的音频为空");

    const url = URL.createObjectURL(blob);
    const audio = $("ttsAudio");
    if(audio.dataset.objectUrl) URL.revokeObjectURL(audio.dataset.objectUrl);
    audio.dataset.objectUrl = url;
    audio.src = url;
    audio.currentTime = 0;
    audio.onended = ()=>{ $("ttsStatus").textContent = "当前：腾讯云 AI"; };
    audio.onerror = ()=>{ $("ttsStatus").textContent = "音频已生成，但浏览器播放失败。"; };

    await audio.play();
    $("ttsStatus").textContent = "正在播放：腾讯云 AI";
  }catch(e){
    $("ttsStatus").textContent = "腾讯云发音失败：" + (e?.message || e);
  }finally{
    $("speakBtn").disabled = false;
  }
});


$("exportBtn").addEventListener("click", ()=>{
  const raw = $("pasteArea").value.trim();
  const content = raw || state.items.map(x => `${x.left}${x.right ? " - " + x.right : ""}`).join("\n");
  if(!content){ alert("还没有可导出的内容"); return; }
  const blob = new Blob(["\ufeff" + content], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "背单词.txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
});

$("pasteArea").addEventListener("input", saveLocal);



let autoSyncTimer = null;
let autoSyncBusy = false;
let autoSyncPending = false;

function scheduleCloudSync(){
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(()=>autoUploadCloud(), 600);
}

async function autoUploadCloud(){
  if(autoSyncBusy){ autoSyncPending = true; return; }
  const user = await currentUser();
  if(!user) return;
  autoSyncBusy = true;
  autoSyncPending = false;
  try{
    saveLocal();
    let local = {};
    try{ local = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){}
    $("cloudStatus").textContent = "正在自动同步…";
    const {error} = await sb.from("word_learning_sync").upsert({
      user_id:user.id,
      data:local,
      updated_at:new Date().toISOString()
    }, {onConflict:"user_id"});
    $("cloudStatus").textContent = error ? ("自动同步失败：" + error.message) : "已自动同步到云端";
  } finally {
    autoSyncBusy = false;
    if(autoSyncPending) scheduleCloudSync();
  }
}

async function currentUser(){
  const {data:{user}} = await sb.auth.getUser();
  return user;
}
async function refreshAuthStatus(){
  const user = await currentUser();
  if(user){
    $("cloudLoginRow").style.display = "none";
    $("cloudLoggedRow").style.display = "flex";
    $("cloudManualRow").style.display = "none";
    $("cloudUserText").textContent = "☁️ 云同步已开启";
    $("cloudStatus").textContent = "已自动同步到云端";
    $("cloudAccount").value = user.email || "";
  }else{
    $("cloudLoginRow").style.display = "flex";
    $("cloudLoggedRow").style.display = "none";
    $("cloudManualRow").style.display = "none";
    $("cloudStatus").textContent = "未登录。登录后开启实时自动同步。";
  }
}
$("loginBtn").addEventListener("click", async ()=>{
  const email = $("cloudAccount").value.trim();
  const password = $("cloudPassword").value;
  if(!email || !password){ alert("请输入邮箱和密码"); return; }
  $("cloudStatus").textContent = "正在登录…";
  const {error} = await sb.auth.signInWithPassword({email,password});
  if(error){ $("cloudStatus").textContent = "登录失败：" + error.message; return; }
  $("cloudPassword").value = "";
  await refreshAuthStatus();
  const user = await currentUser();
  if(user){
    const {data,error} = await sb.from("word_learning_sync").select("data,updated_at").eq("user_id",user.id).maybeSingle();
    if(!error && data?.data){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data));
      loadLocal();
      renderFolders();
      render();
      $("cloudStatus").textContent = "已登录并自动下载云端数据";
    }else{
      scheduleCloudSync();
    }
  }
});
$("logoutBtn").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  await refreshAuthStatus();
  $("cloudStatus").textContent = "已退出登录。";
});
$("cloudUploadBtn").addEventListener("click", async ()=>{
  const user = await currentUser();
  if(!user){ $("cloudStatus").textContent = "请先登录。"; return; }
  saveLocal();
  let local = {};
  try{ local = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){}
  $("cloudStatus").textContent = "正在上传云端…";
  const {error} = await sb.from("word_learning_sync").upsert({
    user_id:user.id,
    data:local,
    updated_at:new Date().toISOString()
  }, {onConflict:"user_id"});
  $("cloudStatus").textContent = error ? ("上传失败：" + error.message) : "已同步到云端。";
});
$("cloudDownloadBtn").addEventListener("click", async ()=>{
  const user = await currentUser();
  if(!user){ $("cloudStatus").textContent = "请先登录。"; return; }
  $("cloudStatus").textContent = "正在下载云端数据…";
  const {data,error} = await sb.from("word_learning_sync").select("data,updated_at").eq("user_id",user.id).maybeSingle();
  if(error){ $("cloudStatus").textContent = "下载失败：" + error.message; return; }
  if(!data){ $("cloudStatus").textContent = "云端还没有数据。"; return; }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data || {}));
  loadLocal();
  renderFolders();
  render();
  $("cloudStatus").textContent = "云端数据已下载。";
});

function refreshTtsLoginUI(){
  const hasPwd = !!localStorage.getItem(TTS_PASSWORD_KEY);
  $("ttsLoginRow").style.display = hasPwd ? "none" : "flex";
  $("ttsLoggedRow").style.display = hasPwd ? "flex" : "none";
  if(hasPwd && !$("ttsStatus").textContent.includes("失败")){
    $("ttsStatus").textContent = "腾讯云发音已登录。";
  }
}

$("ttsLoginBtn").addEventListener("click", async ()=>{
  const pwd = $("ttsPassword").value.trim();
  if(!pwd){
    $("ttsStatus").textContent = "请输入接口密码。";
    return;
  }

  $("ttsLoginBtn").disabled = true;
  $("ttsLoginBtn").textContent = "验证中…";
  $("ttsStatus").textContent = "正在验证腾讯云接口密码…";

  try{
    const r = await fetch(TTS_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-transcribe-password":pwd
      },
      body:JSON.stringify({
        text:"hello",
        voiceType:502003,
        speed:-0.5,
        segmentRate:0
      })
    });

    if(!r.ok){
      let msg = "";
      try{
        const j = await r.json();
        msg = j.error || j.message || "";
      }catch(e){
        try{ msg = await r.text(); }catch(_){}
      }
      throw new Error(msg || `HTTP ${r.status}`);
    }

    // Password is only stored after the server really accepts it.
    localStorage.setItem(TTS_PASSWORD_KEY, pwd);
    localStorage.setItem(VOICE_SOURCE_KEY, "tencent");
    $("voiceSource").value = "tencent";
    $("ttsPassword").value = "";
    refreshTtsLoginUI();
    $("ttsStatus").textContent = "腾讯云已验证，发音方式已切换为腾讯云 AI。";
  }catch(e){
    localStorage.removeItem(TTS_PASSWORD_KEY);
    $("ttsLoginRow").style.display = "flex";
    $("ttsLoggedRow").style.display = "none";
    $("ttsStatus").textContent = "登录失败：" + (e?.message || e);
  }finally{
    $("ttsLoginBtn").disabled = false;
    $("ttsLoginBtn").textContent = "登录";
  }
});

$("ttsLogoutBtn").addEventListener("click", ()=>{
  localStorage.removeItem(TTS_PASSWORD_KEY);
  $("ttsPassword").value = "";
  refreshTtsLoginUI();
  $("ttsStatus").textContent = "请重新输入接口密码。";
});

// Keyboard support
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if(e.key === "ArrowLeft") $("prevBtn").click();
  if(e.key === "ArrowRight") $("nextBtn").click();
  if(e.key === " ") { e.preventDefault(); $("speakBtn").click(); }
});

loadLocal();
renderFolders();

const savedVoiceSource = localStorage.getItem(VOICE_SOURCE_KEY) || "google";
$("voiceSource").value = savedVoiceSource;
$("voiceSource").addEventListener("change", ()=>{
  localStorage.setItem(VOICE_SOURCE_KEY, $("voiceSource").value);
  $("ttsStatus").textContent = $("voiceSource").value === "google" ? "当前：谷歌发音" : "当前：腾讯云 AI";
});

refreshTtsLoginUI();
refreshAuthStatus();
render();
</script>
